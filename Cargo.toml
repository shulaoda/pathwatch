[package]
name = "pathwatch"
description = "A path-based file event watcher"
version = "0.0.0"
edition = "2024"
# The toolchain of `rust-toolchain.toml`: the only one that the tests run on.
rust-version = "1.99"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shulaoda/pathwatch"
keywords = ["watch", "watcher", "filesystem", "events"]
categories = ["filesystem"]
# What a published package holds, next to this file and the README. The tests stay in the
# repository.
include = ["src/**/*.rs", "examples/**/*.rs", "LICENSE"]

[dependencies]
bitflags = { version = "2.13.2", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
rustc-hash = "2.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[features]
# What only the tests of the repository call: the hooks of the engine, the checks of the tree,
# what the backends show of themselves, and `Watcher::with_backend`. Not part of the API.
test-hooks = []

[dev-dependencies]
# The tests build the crate with its hooks.
pathwatch = { path = ".", features = ["test-hooks"] }
tempfile = "3.26.0"

[lints.rust]
missing_debug_implementations = "deny"
unused_qualifications = "deny"
redundant_imports = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unnameable_types = "deny"
unit_bindings = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
macro_use_extern_crate = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
# Same guidelines as rolldown: the pedantic group is on, restriction rules are opt-in, and a
# rule is only turned off when it is a false positive or pure noise.
pedantic = { level = "deny", priority = -1 }
# `#[must_use]` everywhere is noise, a test helper needs no `# Panics` section, and the docs
# name FSEvents and ReadDirectoryChangesW without backticks.
must_use_candidate = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# --- restriction
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
fn_to_numeric_cast_any = "deny"
mixed_read_write_in_expression = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
assertions_on_result_states = "deny"
unused_result_ok = "deny"
as_underscore = "deny"
deref_by_slicing = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
pathbuf_init_then_push = "deny"
pub_without_shorthand = "deny"
self_named_module_files = "deny"
string_lit_chars_any = "deny"
unnecessary_self_imports = "deny"
large_include_file = "deny"
needless_raw_strings = "deny"
str_to_string = "deny"
mem_forget = "deny"
verbose_file_reads = "deny"
format_push_string = "deny"
infinite_loop = "deny"
unseparated_literal_suffix = "deny"
redundant_type_annotations = "deny"
unwrap_in_result = "deny"
[profile.release]
debug = "line-tables-only"
