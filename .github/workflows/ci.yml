name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc -p pathwatch --no-deps
      # What a release would hold, built from the packed files alone.
      - run: cargo package -p pathwatch --locked

  # The benchmark is a workspace of its own: its adapters must still fit the crate.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cargo check --workspace --all-targets --locked
        working-directory: bench

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # `close` waits for the thread of the watcher: a deadlock must fail the run, not hold it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The backend of each OS has docs of its own.
      - run: cargo doc -p pathwatch --no-deps
      - run: cargo test --workspace --no-fail-fast --locked

  wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-wasip1-threads
      - run: cargo check -p pathwatch --target wasm32-wasip1-threads

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-linux-android
      - run: cargo clippy -p pathwatch --all-targets --target aarch64-linux-android -- -D warnings
