name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Every job installs the toolchain of `rust-toolchain.toml` itself: rustup no longer promises
# to do that on the first `cargo` call.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc -p pathwatch --no-deps
      # What a release would hold, built from the packed files alone.
      - run: cargo package -p pathwatch --locked

  # The benchmark is a workspace of its own: its adapters must still fit the crate.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo check --workspace --all-targets --locked
        working-directory: bench

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # `close` waits for the thread of the watcher: a deadlock must fail the run, not hold it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The backend of each OS has docs of its own.
      - run: cargo doc -p pathwatch --no-deps
      - run: cargo test --workspace --no-fail-fast --locked
      # The tests of a limit of the OS run alone, after the others.
      - if: runner.os == 'macOS'
        run: cargo test -p pathwatch --test fsevents -- --ignored failed_start
      - if: runner.os == 'Linux'
        run: unshare -Urm sh -c 'echo 8 > /proc/sys/user/max_inotify_watches && cargo test -p pathwatch --test inotify -- --ignored'
      # The big fuzz runs on seeds of the day, as a release build: new seeds every day, and the
      # engine once without the debug checks. A failure names its seed.
      - if: runner.os == 'Linux'
        run: PATHWATCH_FUZZ_FIRST=$(( $(date +%s) / 86400 * 100000 )) cargo test --release -p pathwatch --test sim fuzz::big -- --ignored

  # The targets that no runner has: the crate and its tests are linted for each of them.
  targets:
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-unknown-freebsd
          - aarch64-linux-android
          - wasm32-wasip1-threads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo clippy -p pathwatch --all-targets --target ${{ matrix.target }} -- -D warnings
