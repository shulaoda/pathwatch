[package]
name = "pathwatch"
description = "A path-based file event watcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/shulaoda/pathwatch"
keywords = ["watch", "watcher", "filesystem", "events"]
categories = ["filesystem"]
# What a published package holds, next to this file and the README. The tests stay in the
# repository: half of them need `pathwatch_sim`, which is not published.
include = ["src/**/*.rs", "examples/**/*.rs", "LICENSE"]

[lints]
workspace = true

[dependencies]
bitflags = { workspace = true }
hashbrown = { workspace = true }
rustc-hash = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
