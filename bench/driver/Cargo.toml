[package]
name = "driver"
description = "Runs one adapter at a time against a tree of files and measures it from outside"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "bench"

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
